name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Git SHA to deploy (defaults to latest main)"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # required to access PRODUCTION_* environment secrets

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.ref }}

      - name: Resolve SHA
        id: sha
        run: echo "value=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Write production tfvars (non-secret values only)
        run: |
          cat > infra/terraform/terraform.tfvars.production <<'EOF'
          environment = "production"
          enable_lb   = true
          api_domain  = "api.botnoa.com"
          EOF

      - name: Get registry endpoint
        id: registry
        run: |
          endpoint=$(curl -sf \
            -H "X-Auth-Token: ${{ secrets.SCW_SECRET_KEY }}" \
            "https://api.scaleway.com/registry/v1/regions/fr-par/namespaces" \
            | jq -r '.namespaces[] | select(.name == "noa-production") | .endpoint')
          echo "endpoint=$endpoint" >> $GITHUB_OUTPUT

      - name: Log in to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.endpoint }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64
          tags: ${{ steps.registry.outputs.endpoint }}/noa-api:${{ steps.sha.outputs.value }}

      - name: Terraform init (production state)
        working-directory: infra/terraform
        run: terraform init -reconfigure -backend-config=production.tfbackend

      - name: Deploy (update container image)
        working-directory: infra/terraform
        env:
          TF_VAR_db_password: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          TF_VAR_anthropic_api_key: ${{ secrets.PRODUCTION_ANTHROPIC_API_KEY }}
          TF_VAR_telegram_bot_token: ${{ secrets.PRODUCTION_TELEGRAM_BOT_TOKEN }}
          TF_VAR_telegram_webhook_secret: ${{ secrets.PRODUCTION_TELEGRAM_WEBHOOK_SECRET }}
          TF_VAR_openai_api_key: ${{ secrets.PRODUCTION_OPENAI_API_KEY }}
          TF_VAR_google_client_id: ${{ secrets.PRODUCTION_GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.PRODUCTION_GOOGLE_CLIENT_SECRET }}
          TF_VAR_google_redirect_uri: ${{ secrets.PRODUCTION_GOOGLE_REDIRECT_URI }}
          TF_VAR_sentry_dsn: ${{ secrets.PRODUCTION_SENTRY_DSN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_twilio_account_sid: ${{ secrets.PRODUCTION_TWILIO_ACCOUNT_SID }}
          TF_VAR_twilio_api_key_sid: ${{ secrets.PRODUCTION_TWILIO_API_KEY_SID }}
          TF_VAR_twilio_client_secret: ${{ secrets.PRODUCTION_TWILIO_CLIENT_SECRET }}
          TF_VAR_twilio_whatsapp_from: ${{ secrets.PRODUCTION_TWILIO_WHATSAPP_FROM }}
        run: |
          terraform apply -auto-approve \
            -target=scaleway_container.api \
            -target=scaleway_container_domain.api \
            -target=cloudflare_record.api \
            -var-file=terraform.tfvars.production \
            -var "image_tag=${{ steps.sha.outputs.value }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run migrations (production)
        env:
          TELEGRAM_BOT_TOKEN: dummy
          TELEGRAM_WEBHOOK_SECRET: dummy
          ANTHROPIC_API_KEY: dummy
          OPENAI_API_KEY: dummy
        run: |
          pip install -e . -q
          export DATABASE_URL=$(cd infra/terraform && terraform output -raw database_url)
          alembic upgrade head

