name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: noa
          POSTGRES_PASSWORD: noa
          POSTGRES_DB: noa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://noa:noa@localhost/noa
      TELEGRAM_BOT_TOKEN: dummy
      TELEGRAM_WEBHOOK_SECRET: dummy
      ANTHROPIC_API_KEY: dummy
      OPENAI_API_KEY: dummy
      SCW_ACCESS_KEY: dummy
      SCW_SECRET_KEY: dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app

      - name: Unit tests
        run: pytest tests/unit --cov=app --cov-report=term-missing

      - name: Apply migrations
        run: alembic upgrade head

      - name: Integration tests
        run: pytest tests/integration

  deploy-dev:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init (dev state)
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config=dev.tfbackend \
            -backend-config="access_key=$SCW_ACCESS_KEY" \
            -backend-config="secret_key=$SCW_SECRET_KEY"

      - name: Get registry endpoint
        id: registry
        working-directory: infra/terraform
        run: echo "endpoint=$(terraform output -raw registry_endpoint)" >> $GITHUB_OUTPUT

      - name: Log in to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.endpoint }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64
          tags: ${{ steps.registry.outputs.endpoint }}/noa-api:${{ github.sha }}

      - name: Deploy (terraform apply)
        working-directory: infra/terraform
        run: |
          terraform apply -auto-approve \
            -var "environment=dev" \
            -var "image_tag=${{ github.sha }}" \
            -var "enable_lb=false" \
            -var "db_password=${{ secrets.TF_VAR_DB_PASSWORD }}" \
            -var "anthropic_api_key=${{ secrets.ANTHROPIC_API_KEY }}" \
            -var "telegram_bot_token=${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            -var "telegram_webhook_secret=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}" \
            -var "openai_api_key=${{ secrets.OPENAI_API_KEY }}"
