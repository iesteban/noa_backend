name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app

      - name: Test
        env:
          DATABASE_URL: postgresql+asyncpg://noa:noa@localhost/noa
          TELEGRAM_BOT_TOKEN: dummy
          TELEGRAM_WEBHOOK_SECRET: dummy
          ANTHROPIC_API_KEY: dummy
          OPENAI_API_KEY: dummy
          SCW_ACCESS_KEY: dummy
          SCW_SECRET_KEY: dummy
        run: pytest tests/unit --cov=app --cov-report=term-missing
