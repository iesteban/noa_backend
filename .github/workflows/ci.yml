name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: noa
          POSTGRES_PASSWORD: noa
          POSTGRES_DB: noa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://noa:noa@localhost/noa
      TELEGRAM_BOT_TOKEN: dummy
      TELEGRAM_WEBHOOK_SECRET: dummy
      ANTHROPIC_API_KEY: dummy
      OPENAI_API_KEY: dummy
      SCW_ACCESS_KEY: dummy
      SCW_SECRET_KEY: dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app

      - name: Unit tests
        run: pytest tests/unit --cov=app --cov-report=term-missing

      - name: Apply migrations
        run: alembic upgrade head

      - name: Integration tests
        run: pytest tests/integration

  deploy-dev:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init (dev state)
        working-directory: infra/terraform
        run: terraform init -backend-config=dev.tfbackend

      - name: Get registry endpoint
        id: registry
        working-directory: infra/terraform
        run: echo "endpoint=$(terraform output -raw registry_endpoint)" >> $GITHUB_OUTPUT

      - name: Log in to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.endpoint }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64
          tags: ${{ steps.registry.outputs.endpoint }}/noa-api:${{ github.sha }}

      - name: Write dev tfvars
        run: |
          cat > infra/terraform/terraform.tfvars.dev <<'EOF'
          environment = "dev"
          enable_lb   = false
          EOF

      - name: Deploy (terraform apply)
        working-directory: infra/terraform
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TF_VAR_telegram_webhook_secret: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
        run: |
          terraform apply -auto-approve \
            -var-file=terraform.tfvars.dev \
            -var "image_tag=${{ github.sha }}"
