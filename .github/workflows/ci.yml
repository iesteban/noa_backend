name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: noa
          POSTGRES_PASSWORD: noa
          POSTGRES_DB: noa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://noa:noa@localhost/noa
      TELEGRAM_BOT_TOKEN: dummy
      TELEGRAM_WEBHOOK_SECRET: dummy
      ANTHROPIC_API_KEY: dummy
      OPENAI_API_KEY: dummy
      SCW_ACCESS_KEY: dummy
      SCW_SECRET_KEY: dummy
      SENTRY_DSN: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app

      - name: Unit tests
        run: pytest tests/unit --cov=app --cov-report=term-missing

      - name: Apply migrations
        run: alembic upgrade head

      - name: Integration tests
        run: pytest tests/integration

  deploy-staging:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Write staging tfvars
        run: |
          cat > infra/terraform/terraform.tfvars.staging <<'EOF'
          environment = "staging"
          enable_lb   = false
          api_domain  = "api-staging.botnoa.com"
          EOF

      - name: Get registry endpoint
        id: registry
        run: |
          endpoint=$(curl -sf \
            -H "X-Auth-Token: ${{ secrets.SCW_SECRET_KEY }}" \
            "https://api.scaleway.com/registry/v1/regions/fr-par/namespaces" \
            | jq -r '.namespaces[] | select(.name == "noa-staging") | .endpoint')
          echo "endpoint=$endpoint" >> $GITHUB_OUTPUT

      - name: Log in to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.endpoint }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64
          tags: ${{ steps.registry.outputs.endpoint }}/noa-api:${{ github.sha }}

      - name: Terraform init (staging state)
        working-directory: infra/terraform
        run: terraform init -backend-config=staging.tfbackend

      - name: Deploy (update container image)
        working-directory: infra/terraform
        env:
          TF_VAR_db_password: ${{ secrets.STAGING_DB_PASSWORD }}
          TF_VAR_anthropic_api_key: ${{ secrets.STAGING_ANTHROPIC_API_KEY }}
          TF_VAR_telegram_bot_token: ${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}
          TF_VAR_telegram_webhook_secret: ${{ secrets.STAGING_TELEGRAM_WEBHOOK_SECRET }}
          TF_VAR_telegram_bot_username: ${{ secrets.STAGING_TELEGRAM_BOT_USERNAME }}
          TF_VAR_openai_api_key: ${{ secrets.STAGING_OPENAI_API_KEY }}
          TF_VAR_google_client_id: ${{ secrets.STAGING_GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.STAGING_GOOGLE_CLIENT_SECRET }}
          TF_VAR_google_redirect_uri: ${{ secrets.STAGING_GOOGLE_REDIRECT_URI }}
          TF_VAR_sentry_dsn: ${{ secrets.STAGING_SENTRY_DSN }}
          TF_VAR_twilio_account_sid: ${{ secrets.STAGING_TWILIO_ACCOUNT_SID }}
          TF_VAR_twilio_api_key_sid: ${{ secrets.STAGING_TWILIO_API_KEY_SID }}
          TF_VAR_twilio_client_secret: ${{ secrets.STAGING_TWILIO_CLIENT_SECRET }}
          TF_VAR_twilio_whatsapp_from: ${{ secrets.STAGING_TWILIO_WHATSAPP_FROM }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          terraform apply -auto-approve \
            -target=scaleway_container.api \
            -target=scaleway_container_domain.api \
            -target=cloudflare_record.api \
            -var-file=terraform.tfvars.staging \
            -var "image_tag=${{ github.sha }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run migrations (staging)
        env:
          TELEGRAM_BOT_TOKEN: dummy
          TELEGRAM_WEBHOOK_SECRET: dummy
          ANTHROPIC_API_KEY: dummy
          OPENAI_API_KEY: dummy
        run: |
          pip install -e . -q
          export DATABASE_URL=$(cd infra/terraform && terraform output -raw database_url)
          alembic upgrade head
